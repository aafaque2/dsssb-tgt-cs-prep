<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Free practice platform for DSSSB TGT Computer Science: 1,600 real previous-year questions from 8 actual papers, full timed mocks, topic drills and a mistakes list. Works offline; no sign-up.">
<title>DSSSB TGT CS Prep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5fd0'/%3E%3Ctext x='32' y='43' font-size='28' text-anchor='middle' fill='white' font-family='Segoe UI,Arial,sans-serif' font-weight='700'%3ECS%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fa;--surface:#fff;--surface2:#f0f2f7;--text:#1b2230;--muted:#5d6779;--border:#e1e5ee;
  --primary:#2f5fd0;--primary-soft:#e8eefc;--green:#15803d;--green-soft:#e7f6ec;--red:#c62828;--red-soft:#fdecec;
  --amber:#b45309;--amber-soft:#fdf3e2;--purple:#6d3fd6;--purple-soft:#efe9fc;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --paper:#fff;--radius:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c;--surface:#171d27;--surface2:#1e2532;--text:#e6e9ef;--muted:#9aa4b5;--border:#2a3241;
  --primary:#6f95ff;--primary-soft:#1f2a44;--green:#3fbf6f;--green-soft:#15291d;--red:#ff6b6b;--red-soft:#331b1d;
  --amber:#f0a83a;--amber-soft:#33261a;--purple:#a98bff;--purple-soft:#272040;--shadow:none;--paper:#fff;}}
:root[data-theme="dark"]{
  --bg:#0f141c;--surface:#171d27;--surface2:#1e2532;--text:#e6e9ef;--muted:#9aa4b5;--border:#2a3241;
  --primary:#6f95ff;--primary-soft:#1f2a44;--green:#3fbf6f;--green-soft:#15291d;--red:#ff6b6b;--red-soft:#331b1d;
  --amber:#f0a83a;--amber-soft:#33261a;--purple:#a98bff;--purple-soft:#272040;--shadow:none;--paper:#fff;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif}
a{color:var(--primary)}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:56px}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand small{color:var(--muted);font-weight:500;margin-left:6px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs a.on{background:var(--primary-soft);color:var(--primary)}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer}
main{padding:20px 0 60px}
h1{font-size:1.5rem;margin:.2em 0 .4em;letter-spacing:-.02em}
h2{font-size:1.15rem;margin:0 0 .6em}
h3{font-size:1rem;margin:0 0 .4em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}
@media (min-width:561px) and (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .v{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:.85rem}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--primary-soft);color:var(--primary)}
.pill.purple{background:var(--purple-soft);color:var(--purple)}
.exbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);border-left:3px solid var(--primary)}
.exbox.kw{border-left-color:var(--amber)}
.exhead{font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;cursor:help}
.exhead .pill{text-transform:none;letter-spacing:0}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:.82rem}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary)}
.bar.green>i{background:var(--green)}.bar.red>i{background:var(--red)}.bar.amber>i{background:var(--amber)}
.list{display:grid;gap:10px}
.paperrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.paperrow .meta{flex:1;min-width:220px}
.note{border-left:3px solid var(--amber);background:var(--amber-soft);padding:10px 12px;border-radius:8px;font-size:.9rem}
.note.blue{border-color:var(--primary);background:var(--primary-soft)}
.note.green{border-color:var(--green);background:var(--green-soft)}
.note.red{border-color:var(--red);background:var(--red-soft)}
label.chk{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--surface)}
label.chk input{accent-color:var(--primary)}
select,input[type=date],input[type=number],input[type=text]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2230;color:#fff;padding:10px 16px;border-radius:10px;z-index:100;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);color:var(--text);border-radius:14px;max-width:520px;width:100%;padding:20px;border:1px solid var(--border)}
/* ---------- question rendering ---------- */
.qpaper{background:var(--paper);color:#111;border-radius:10px;padding:14px 16px;border:1px solid var(--border);overflow-x:auto}
.qpaper img{display:block;max-width:100%;height:auto}
.qhtml{font-size:calc(1rem * var(--z,1));line-height:1.55}
.qhtml p{margin:.35em 0}
.qhtml table{border-collapse:collapse;margin:.4em 0}
.qhtml td,.qhtml th{border:1px solid #c9ced8;padding:4px 8px}
.qhtml img{display:inline-block;vertical-align:middle;max-width:100%}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--primary)}
.opt .lbl{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:var(--muted);background:var(--surface)}
.opt .oc{flex:0 1 auto;min-width:0;max-width:100%;background:var(--paper);color:#111;border-radius:6px;padding:4px 8px;overflow-x:auto}
.opt .oc img{display:block;max-width:100%;height:auto}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .lbl{background:var(--primary);border-color:var(--primary);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .lbl{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .lbl{background:var(--red);border-color:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.expl{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface2)}
.expl .qhtml{color:var(--text)}
/* ---------- exam ---------- */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:960px){.exam{grid-template-columns:1fr}.exam .side{display:none}.exam .side.open{display:block;position:fixed;inset:56px 0 0 0;z-index:30;overflow:auto;background:var(--bg);padding:16px}}
.examhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;padding:6px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--border)}
.timer.low{color:var(--red);border-color:var(--red)}
.sectabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.sectabs button{white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--muted)}
.sectabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pal button{height:34px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-weight:600;font-size:.82rem;position:relative;color:var(--text)}
.pal button.na{background:#e0483e;border-color:#e0483e;color:#fff}
.pal button.ans{background:#1f9d55;border-color:#1f9d55;color:#fff}
.pal button.mk{background:#6d3fd6;border-color:#6d3fd6;color:#fff}
.pal button.amk{background:#6d3fd6;border-color:#6d3fd6;color:#fff}
.pal button.amk::after{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-radius:50%;background:#3ddc84;border:1px solid #fff}
.pal button.cur{outline:2px solid var(--primary);outline-offset:1px}
.pal button.r{background:#1f9d55;border-color:#1f9d55;color:#fff}
.pal button.w{background:#e0483e;border-color:#e0483e;color:#fff}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.8rem;margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--border)}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface2)}
.hide{display:none!important}
.center{text-align:center}
.big{font-size:2.4rem;font-weight:800;letter-spacing:-.03em}
.plan li{margin:4px 0}
.plan .done{color:var(--muted);text-decoration:line-through}
.footer-note{margin-top:28px;color:var(--muted);font-size:.82rem}
/* ---------- cheat sheets ---------- */
.y{display:inline-block;font-size:.68rem;font-weight:700;line-height:1.5;color:var(--purple);background:var(--purple-soft);border-radius:999px;padding:0 6px;margin-left:3px;vertical-align:1px;white-space:nowrap}
.sheet .sblk{border-left:4px solid var(--border);padding:2px 0 2px 16px;margin:20px 0 0}
.sheet .sblk.must{border-left-color:var(--green)}
.sheet .sblk.prob{border-left-color:var(--primary)}
.sheet .sblk.later{border-left-color:var(--muted)}
.sheet .sblk>h2{font-size:1.05rem;margin:0 0 6px}
.sheet h4{margin:14px 0 4px;font-size:.95rem}
.sheet ul{margin:4px 0;padding-left:20px}
.sheet li{margin:4px 0}
.sheet p{margin:6px 0}
.sheet table.t{margin:6px 0 4px}
.sheet table.t th,.sheet table.t td{padding:5px 8px}
.sheet code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:var(--surface2);padding:0 4px;border-radius:4px}
.sheet+.sheet{margin-top:16px}
@media print{
  :root{--bg:#fff!important;--surface:#fff!important;--surface2:#f2f3f5!important;--text:#000!important;--muted:#444!important;--border:#c8ccd4!important;--primary:#1d4ed8!important;--primary-soft:#e8eefc!important;--green:#15803d!important;--green-soft:#e7f6ec!important;--amber:#b45309!important;--amber-soft:#fdf3e2!important;--purple:#5b21b6!important;--purple-soft:#ede9fe!important;--shadow:none!important}
  .sheet table.t{font-size:1em}
  header.top,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  .wrap{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:0}
  .sheet+.sheet{break-before:page;margin-top:0}
  .sheet li,.sheet tr{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}
@media (max-width:560px){.brand small{display:none}header.top .wrap{gap:8px}nav.tabs a{padding:8px 8px}h1{font-size:1.3rem}
  .card.sheet{padding:12px}.sheet .sblk{padding-left:10px}.sheet ul{padding-left:16px}.sheet table.t{font-size:.84rem}.sheet table.t th,.sheet table.t td{padding:4px 5px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">TGT CS Prep<small>Post 41/26</small></div>
  <nav class="tabs" id="tabs">
    <a href="#/home" data-t="home">Home</a>
    <a href="#/mocks" data-t="mocks">Mock tests</a>
    <a href="#/practice" data-t="practice">Practice</a>
    <a href="#/sheets" data-t="sheets">Cheat sheets</a>
    <a href="#/mistakes" data-t="mistakes">Mistakes</a>
    <a href="#/facts" data-t="facts">Exam facts</a>
    <a href="#/settings" data-t="settings">Settings</a>
  </nav>
  <button class="iconbtn" id="themeBtn" title="Toggle light/dark">◐</button>
</div></header>
<main><div class="wrap" id="app"></div></main>

<script src="data/papers.js"></script>
<script src="data/sheets-b.js"></script>
<script src="data/sheets-b2.js"></script>
<script src="data/sheets-a.js"></script>
<script>
"use strict";
/* ======================================================================= data */
const D = window.DSSSB_DATA;
const app = document.getElementById("app");
if (!D) { app.innerHTML = '<div class="card"><h2>Question data not found</h2><p>Keep <code>index.html</code> next to the <code>data</code> and <code>img</code> folders and open it from there.</p></div>'; throw new Error("no data"); }
const PAPERS = D.papers;
const PMAP = Object.fromEntries(PAPERS.map(p => [p.id, p]));
const Q = {};
for (const p of PAPERS) for (const q of D.questions[p.id]) { q.pid = p.id; q.ref = p.id + "#" + q.n; Q[q.ref] = q; }
const ALL_REFS = Object.keys(Q);
const SECTIONS = ["Reasoning","General Awareness","Arithmetic","English","Hindi","Discipline 1","Discipline 2","Discipline 3","Discipline 4","Discipline 5","Teaching Methodology"];
const PART_A = SECTIONS.slice(0, 5), PART_B = SECTIONS.slice(5);
const QUAL = { UR: 40, EWS: 40, OBC: 35, SC: 30, ST: 30, PwBD: 30 };
const CUTOFF_3922 = { UR: 128.04, EWS: 108.88, OBC: 114.01, SC: 110.17, ST: 103.09 };
const REPO = "https://github.com/aafaque2/dsssb-tgt-cs-prep";
const MOCK_ORDER = ["2025-09-12-s1","2023-06-24-s3","2023-06-25-s1","2023-06-25-s2","2021-08-01-s2","2021-08-07-s1","2021-08-07-s2","2024-02-07-s2"];

/* ======================================================================= store */
const KEY = "tgtcs41.v1";
function fresh() { return { v: 1, settings: { examDate: "2026-11-27", category: "UR", theme: "auto", zoom: 1, lang: "en" }, attempts: {}, qs: {} }; }
let S = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) { s.settings = Object.assign(fresh().settings, s.settings || {}); s.attempts = s.attempts || {}; s.qs = s.qs || {}; return s; } } catch (e) {} return fresh(); })();
let saveWarned = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { if (!saveWarned) { saveWarned = true; toast("Progress could not be saved in this browser. Use Settings → Export backup."); } } }
window.addEventListener("pagehide", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

/* ======================================================================= utils */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const n2 = x => (Math.round(x * 100) / 100).toFixed(2).replace(/\.00$/, "");
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysLeft = () => { const d = new Date(S.settings.examDate + "T00:00:00"); return Math.round((d - today()) / 864e5); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function modal(html, buttons) {
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}<div class="row" style="justify-content:flex-end;margin-top:16px">${buttons.map((b, i) => `<button class="btn ${b.cls || ""}" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div>`;
    bg.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) { bg.remove(); res(buttons[+b.dataset.i].value); } else if (e.target === bg) { bg.remove(); res(null); } });
    document.body.appendChild(bg); bg.querySelector("button[data-i]")?.focus();
  });
}
function applyTheme() { const t = S.settings.theme; if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
document.getElementById("themeBtn").onclick = () => { const cur = S.settings.theme; const dark = cur === "dark" || (cur === "auto" && matchMedia("(prefers-color-scheme: dark)").matches); S.settings.theme = dark ? "light" : "dark"; save(); applyTheme(); };
applyTheme();

/* ======================================================================= question stats */
function recordResult(ref, chosen) {
  const q = Q[ref]; const st = S.qs[ref] || (S.qs[ref] = { c: 0, w: 0 });
  if (chosen == null) return;
  if (chosen === q.key) { st.c++; st.last = "c"; } else { st.w++; st.last = "w"; st.mastered = false; }
  st.at = Date.now();
}
function sectionAccuracy() {
  const agg = {}; for (const s of SECTIONS) agg[s] = { c: 0, w: 0, seen: 0 };
  for (const [ref, st] of Object.entries(S.qs)) { const q = Q[ref]; if (!q) continue; const a = agg[q.sec]; a.c += st.c; a.w += st.w; if (st.c + st.w) a.seen++; }
  return agg;
}
const mistakes = () => Object.entries(S.qs).filter(([r, st]) => Q[r] && st.last === "w" && !st.mastered).map(([r]) => r);

/* ======================================================================= scoring */
function score(at) {
  const mk = () => ({ n: 0, att: 0, c: 0, w: 0, net: 0, time: 0 });
  const r = { all: mk(), A: mk(), B: mk(), sec: {} };
  for (const ref of at.refs) {
    const q = Q[ref], a = at.answers[ref], t = at.time[ref] || 0;
    const sec = r.sec[q.sec] || (r.sec[q.sec] = mk());
    for (const b of [r.all, r[q.part], sec]) {
      b.n++; b.time += t;
      if (a != null) { b.att++; if (a === q.key) { b.c++; b.net += 1; } else { b.w++; b.net -= 0.25; } }
    }
  }
  return r;
}

/* ======================================================================= rendering of a question */
function zoom() { return S.settings.zoom || 1; }
const CROP_SCALE = 0.8; // crops are rendered at 2x PDF size; 0.8 keeps the small 2023 print readable
function stemHTML(q, lang) {
  if (q.stem) { const w = Math.round(q.stem[0] * CROP_SCALE * zoom()); return `<div class="qpaper"><img src="img/${q.pid}/${q.n}.png" width="${w}" alt="Question ${q.n}" loading="lazy"></div>`; }
  const h = lang === "hi" && q.hi ? q.hi : q.html;

function pickRefs(pool, n, mode) {

  else if (mode === "weak") chosen = shuffle(pool.filter(r => st(r) && st(r).last === "w")).concat(shuffle(unseen));
  else chosen = shuffle(unseen).concat(shuffle(pool.filter(r => !unseen.includes(r))));
  // keep comprehension passages readable: order by paper + number inside the chosen set
  return chosen.slice(0, n).sort((a, b) => Q[a].pid === Q[b].pid ? Q[a].n - Q[b].n : MOCK_ORDER.indexOf(Q[a].pid) - MOCK_ORDER.indexOf(Q[b].pid));
}

  function drawQ() {
    const ref = at.refs[at.cur], q = Q[ref]; at.visited[ref] = true;
    const chosen = at.answers[ref]; const revealed = at.instant && chosen != null;
    const p = PMAP[q.pid]; const lang = at.lang || "en";
    qbox.innerHTML = `
      <div class="qhead"><b>Question ${at.cur + 1}</b><span class="muted small">of ${at.refs.length}</span><span class="pill blue">${esc(q.sec)}</span>
        ${isMock ? "" : `${q.tp ? `<span class="pill purple">${esc(q.tp)}</span>` : ""}<span class="pill">${esc(p.title)} · Q${q.n}</span>`}
        <span class="spacer"></span>
        ${q.hi ? `<button class="btn sm" id="lang">${lang === "hi" ? "English" : "हिंदी"}</button>` : ""}
        <button class="btn sm" id="zm" title="Smaller">A−</button><button class="btn sm" id="zp" title="Larger">A+</button>
      </div>
      ${stemHTML(q, lang)}
      <div class="opts">${[1, 2, 3, 4].map(k => {
        let cls = chosen === k ? "sel" : "";
        if (revealed) cls = k === q.key ? "right" : chosen === k ? "wrong" : "";
        return `<button class="opt ${cls}" data-k="${k}" ${revealed ? "disabled" : ""}><span class="lbl">${k}</span><span class="oc">${optHTML(q, k, lang)}</span></button>`;
      }).join("")}</div>
      ${revealed ? feedbackHTML(q, chosen) : ""}
      <div class="actions">
        <button class="btn" id="prev" ${at.cur === 0 ? "disabled" : ""}>← Previous</button>
        ${isMock || at.timed ? `<button class="btn" id="mark">${at.marked[ref] ? "Unmark" : "Mark for review"} &amp; next</button><button class="btn" id="clr">Clear response</button>` : ""}
        <span class="spacer"></span>
        <button class="btn primary" id="next">${at.cur === at.refs.length - 1 ? (isMock || at.timed ? "Save" : "Finish") : (at.instant && !revealed ? "Skip →" : "Save &amp; next →")}</button>
      </div>`;
    drawPalette(); persist();
  }
  function feedbackHTML(q, chosen) {
    const ok = chosen === q.key; const p = PMAP[q.pid];
    return `<div class="expl"><div class="row" style="gap:8px"><b style="color:${ok ? "var(--green)" : "var(--red)"}">${ok ? "Correct" : "Incorrect"} — answer: option ${q.key}</b>${provenance(q)}<span class="pill">${esc(p.title)} · Q${q.n}</span></div>
      ${explHTML(q)}</div>`;
  }
  function choose(k) {
    const ref = at.refs[at.cur];
    if (at.instant && at.answers[ref] != null) return;
    at.answers[ref] = k;
    if (at.instant) recordResult(ref, k);
    drawQ(); persist(true); // answers are saved immediately, never only on the throttled tick
  }
  function move(i) { at.cur = Math.max(0, Math.min(at.refs.length - 1, i)); drawQ(); window.scrollTo({ top: 0 }); }
  function persist(force) { const now = Date.now(); if (force || now - lastSave > 3000) { lastSave = now; save(); } }
  async function submit(auto) {
    const answered = at.refs.filter(r => at.answers[r] != null).length, marked = at.refs.filter(r => at.marked[r]).length;
    const notVisited = at.refs.filter(r => !at.visited[r]).length;
    if (!auto) {
      const ok = await modal(`<h2>${isMock || at.timed ? "Submit the test?" : "Finish this drill?"}</h2><table class="t"><tr><td>Answered</td><td class="num">${answered}</td></tr><tr><td>Not answered</td><td class="num">${at.refs.length - answered}</td></tr><tr><td>Marked for review</td><td class="num">${marked}</td></tr><tr><td>Not visited</td><td class="num">${notVisited}</td></tr></table>`, [{ label: "Keep going", value: false }, { label: isMock || at.timed ? "Submit" : "Finish", value: true, cls: "primary" }]);
      if (!ok) return;
    }
    at.submitted = true; at.ended = Date.now();
    if (!at.instant) for (const r of at.refs) recordResult(r, at.answers[r]);
    save(); go("#/result/" + at.id);
  }
  // events
  qbox.addEventListener("click", e => {
    const o = e.target.closest(".opt"); if (o && !o.disabled) { choose(+o.dataset.k); return; }
    const id2 = e.target.closest("button")?.id;
    const ref = at.refs[at.cur];
    if (id2 === "prev") move(at.cur - 1);
    else if (id2 === "next") { if (at.cur === at.refs.length - 1) { if (!(isMock || at.timed)) submit(); else { persist(true); toast("Saved. Use Submit when you are done."); } } else move(at.cur + 1); }
    else if (id2 === "mark") { at.marked[ref] = !at.marked[ref]; if (at.cur < at.refs.length - 1) move(at.cur + 1); else drawQ(); persist(true); }
    else if (id2 === "clr") { delete at.answers[ref]; drawQ(); persist(true); }
    else if (id2 === "lang") { at.lang = at.lang === "hi" ? "en" : "hi"; drawQ(); }
    else if (id2 === "zm" || id2 === "zp") { S.settings.zoom = Math.max(0.6, Math.min(1.8, Math.round((zoom() + (id2 === "zp" ? 0.1 : -0.1)) * 10) / 10)); save(); drawQ(); }
  });
  palg.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) { move(+b.dataset.i); app.querySelector("#side").classList.remove("open"); } });
  app.querySelector("#tabsec")?.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) move(+b.dataset.i); });
  app.querySelector("#pal").onclick = () => app.querySelector("#side").classList.toggle("open");
  app.querySelector("#sub").onclick = () => submit(false);
  const onKey = e => {
    if (e.target.matches("input,select,textarea") || document.querySelector(".modal-bg")) return;
    if (/^[1-4]$/.test(e.key)) choose(+e.key);
    else if (e.key === "ArrowRight" || e.key === "Enter") { if (at.cur < at.refs.length - 1) move(at.cur + 1); }
    else if (e.key === "ArrowLeft") move(at.cur - 1);
    else if (e.key.toLowerCase() === "m" && (isMock || at.timed)) { const r = at.refs[at.cur]; at.marked[r] = !at.marked[r]; drawQ(); persist(true); }
    else if (e.key.toLowerCase() === "c" && (isMock || at.timed)) { delete at.answers[at.refs[at.cur]]; drawQ(); persist(true); }
  };
  document.addEventListener("keydown", onKey);
  // timer
  let paused = false;
  const tm = app.querySelector("#tm");
  const drawTimer = () => { if (tm) { tm.textContent = (paused ? "⏸ " : "") + fmt(at.remaining); tm.classList.toggle("low", at.remaining <= 300); } };
  if (at.total) {
    app.querySelector("#pz").onclick = () => { paused = !paused; app.querySelector("#pz").textContent = paused ? "Resume" : "Pause"; qbox.style.filter = paused ? "blur(6px)" : ""; drawTimer(); };
  }
  tick = setInterval(() => {
    if (paused || document.hidden) return;
    const ref = at.refs[at.cur]; at.time[ref] = (at.time[ref] || 0) + 1;
    if (at.total) { at.remaining--; drawTimer(); if (at.remaining <= 0) { clearInterval(tick); toast("Time is up — test submitted."); submit(true); return; } }
    persist();
  }, 1000);
  drawTimer(); drawQ();
  cleanup = () => { clearInterval(tick); document.removeEventListener("keydown", onKey); save(); };
}

/* ======================================================================= result */

  app.innerHTML = `<h1>${esc(at.title)} — result</h1>
  <div class="grid g4">
    <div class="card stat"><div class="v">${n2(r.all.net)}<span class="muted small"> / ${r.all.n}</span></div><div class="l">net score (+1 / −0.25)</div></div>
    <div class="card stat"><div class="v">${r.all.c} <span class="small" style="color:var(--green)">✓</span> ${r.all.w} <span class="small" style="color:var(--red)">✗</span></div><div class="l">${r.all.n - r.all.att} not answered</div></div>
    <div class="card stat"><div class="v">${pct(r.all.c, r.all.att)}%</div><div class="l">accuracy on attempted</div></div>
    <div class="card stat"><div class="v">${fmt(r.all.time)}</div><div class="l">time used · ${r.all.n ? Math.round(r.all.time / r.all.n) : 0}s per question</div></div>
  </div>
  ${qual}
  <div class="card" style="margin-top:16px"><h2>By section</h2>
    <table class="t"><thead><tr><th>Section</th><th class="num">Qs</th><th class="num">Attempted</th><th class="num">Correct</th><th class="num">Wrong</th><th class="num">Net</th><th class="num">Accuracy</th><th class="num">Time</th></tr></thead><tbody>${secRows}
    ${r.A.n && r.B.n ? `<tr><td><b>Section A</b></td><td class="num">${r.A.n}</td><td class="num">${r.A.att}</td><td class="num">${r.A.c}</td><td class="num">${r.A.w}</td><td class="num"><b>${n2(r.A.net)}</b></td><td class="num">${accCell(r.A)}</td><td class="num">${fmt(r.A.time)}</td></tr><tr><td><b>Section B</b></td><td class="num">${r.B.n}</td><td class="num">${r.B.att}</td><td class="num">${r.B.c}</td><td class="num">${r.B.w}</td><td class="num"><b>${n2(r.B.net)}</b></td><td class="num">${accCell(r.B)}</td><td class="num">${fmt(r.B.time)}</td></tr>` : ""}

/* ======================================================================= review */
function review(id, filter) {
  const at = S.attempts[id];
  if (!at) { app.innerHTML = `<div class="card">Not found. <a href="#/home">Home</a></div>`; return; }
  filter = filter || "all";
  const want = r => filter === "all" || (filter === "wrong" && at.answers[r] != null && at.answers[r] !== Q[r].key) || (filter === "skipped" && at.answers[r] == null) || (filter === "marked" && at.marked[r]);
  const list = at.refs.filter(want);
  let i = 0, lang = "en";
  const draw = () => {
    if (!list.length) { app.innerHTML = `<h1>Review</h1><div class="card">Nothing here. <a href="#/result/${id}">Back to result</a></div>`; return; }
    const ref = list[i], q = Q[ref], chosen = at.answers[ref], p = PMAP[q.pid];
    const st = S.qs[ref] || {};
    app.innerHTML = `<div class="row"><h1 style="margin:0">Review — ${esc(at.title)}</h1><span class="spacer"></span><a class="btn sm" href="#/result/${id}">Back to result</a></div>
    <div class="row" style="margin:12px 0">${["all", "wrong", "skipped", "marked"].map(f => `<a class="btn sm ${f === filter ? "primary" : ""}" href="#/review/${id}/${f}">${f === "all" ? "All" : f === "wrong" ? "Wrong" : f === "skipped" ? "Not answered" : "Marked"}</a>`).join("")}<span class="spacer"></span><span class="muted small">${i + 1} of ${list.length}</span></div>
    <div class="card">
      <div class="qhead"><b>Question ${at.refs.indexOf(ref) + 1}</b><span class="pill blue">${esc(q.sec)}</span>${q.tp ? `<span class="pill purple">${esc(q.tp)}</span>` : ""}<span class="pill">${esc(p.title)} · Q${q.n}</span>${provenance(q)}<span class="spacer"></span>${q.hi ? `<button class="btn sm" id="lang">${lang === "hi" ? "English" : "हिंदी"}</button>` : ""}</div>
      ${stemHTML(q, lang)}
      <div class="opts">${[1, 2, 3, 4].map(k => `<div class="opt ${k === q.key ? "right" : chosen === k ? "wrong" : ""}"><span class="lbl">${k}</span><span class="oc">${optHTML(q, k, lang)}</span></div>`).join("")}</div>
      <div class="expl"><b>${chosen == null ? "Not answered" : chosen === q.key ? "You answered correctly" : `You chose ${chosen}`} · correct: option ${q.key}</b> <span class="muted small">· time ${fmt(at.time[ref] || 0)}</span>
        ${explHTML(q)}</div>
      <div class="actions"><button class="btn" id="pv" ${i === 0 ? "disabled" : ""}>← Previous</button>
        ${st.last === "w" ? `<button class="btn" id="ms">${st.mastered ? "Unmark mastered" : "Mark as mastered"}</button>` : ""}
        <span class="spacer"></span><button class="btn primary" id="nx" ${i === list.length - 1 ? "disabled" : ""}>Next →</button></div>
    </div>`;
    app.querySelector("#pv").onclick = () => { i--; draw(); };
    app.querySelector("#nx").onclick = () => { i++; draw(); };
    const ms = app.querySelector("#ms"); if (ms) ms.onclick = () => { st.mastered = !st.mastered; save(); draw(); };
    const lg = app.querySelector("#lang"); if (lg) lg.onclick = () => { lang = lang === "hi" ? "en" : "hi"; draw(); };
  };
  draw();
  const onKey = e => { if (e.key === "ArrowRight" && i < list.length - 1) { i++; draw(); } else if (e.key === "ArrowLeft" && i > 0) { i--; draw(); } };
  document.addEventListener("keydown", onKey);
  cleanup = () => document.removeEventListener("keydown", onKey);
}

    <label>My exam date<br><input type="date" id="ed" value="${esc(S.settings.examDate)}" min="2026-11-01" max="2026-12-31"></label>
    <label>My category (for qualifying marks)<br><select id="ct">${Object.keys(QUAL).map(c => `<option ${c === S.settings.category ? "selected" : ""}>${c}</option>`).join("")}</select></label>
    <label>Theme<br><select id="th">${["auto", "light", "dark"].map(t => `<option ${t === S.settings.theme ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <label>Question size<br><input type="number" id="zz" min="0.6" max="1.8" step="0.1" value="${zoom()}"></label>
  </div></div>
  <div class="card" style="margin-top:16px"><h2>Backup</h2>
    <p class="muted small">Progress is stored in this browser only. Export a backup now and then — clearing browser data erases it.</p>
    <div class="row"><button class="btn" id="ex">Export backup</button><label class="btn">Import backup<input type="file" id="im" accept="application/json" class="hide"></label><span class="spacer"></span><button class="btn danger" id="rs">Reset all progress</button></div>
  </div>`;
  app.querySelector("#ed").onchange = e => { if (e.target.value) { S.settings.examDate = e.target.value; save(); toast("Exam date saved"); } };
  app.querySelector("#ct").onchange = e => { S.settings.category = e.target.value; save(); };
  app.querySelector("#th").onchange = e => { S.settings.theme = e.target.value; save(); applyTheme(); };
  app.querySelector("#zz").onchange = e => { const v = parseFloat(e.target.value); if (v >= 0.6 && v <= 1.8) { S.settings.zoom = v; save(); } };
  app.querySelector("#ex").onclick = () => { const b = new Blob([JSON.stringify(S)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `tgtcs-progress-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  app.querySelector("#im").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const s = JSON.parse(t); if (s.v !== 1 || !s.attempts) throw 0; S = s; save(); toast("Backup restored"); applyTheme(); route(); } catch (err) { toast("That file is not a valid backup."); } }); };
  app.querySelector("#rs").onclick = async () => { if (await modal("<h2>Reset everything?</h2><p>All attempts and statistics will be deleted. Export a backup first if unsure.</p>", [{ label: "Cancel", value: false }, { label: "Reset", value: true, cls: "primary" }])) { S = fresh(); save(); applyTheme(); toast("Progress reset"); route(); } };
}

/* ======================================================================= cheat sheets */
// Section B first, each part in rank order (ranks come from past-paper frequency).
const SHEETS = (window.DSSSB_SHEETS || []).slice().sort((a, b) => a.part === b.part ? a.rank - b.rank : a.part === "B" ? -1 : 1);
const sheetPool = s => ALL_REFS.filter(r => s.topics ? s.topics.includes(Q[r].tp) : s.secs.includes(Q[r].sec));
function sheetAcc(s) {
  const ta = topicAccuracy(), sa = sectionAccuracy(); let c = 0, w = 0;
  for (const t of s.topics || []) if (ta[t]) { c += ta[t].c; w += ta[t].w; }
  for (const x of s.secs || []) if (sa[x]) { c += sa[x].c; w += sa[x].w; }
  return { c, w };
}
const tierPill = s => s.tier === "must" ? '<span class="pill green">Must do</span>' : '<span class="pill">If time permits</span>';
function sheetDrill(id) { const s = SHEETS.find(x => x.id === id); if (s) startDrill(pickRefs(sheetPool(s), 20, "unseen"), false, "Drill: " + s.title); }
function sheetsIndex() {
  const row = s => {
    const a = sheetAcc(s), tot = a.c + a.w, p = pct(a.c, tot);
    return `<tr><td class="num">${s.rank}</td><td><a href="#/sheet/${s.id}"><b>${esc(s.title)}</b></a><div class="muted small">${esc(s.freq)}</div></td><td>${tierPill(s)}</td>
      <td>${tot ? `<div class="row" style="gap:8px"><div class="bar ${p >= 70 ? "green" : p >= 50 ? "amber" : "red"}" style="flex:1;min-width:50px"><i style="width:${p}%"></i></div><span class="small">${p}%</span></div>` : '<span class="muted small">not started</span>'}</td>
      <td class="num" style="white-space:nowrap"><a class="btn sm" href="#/sheet/${s.id}">Open</a> <button class="btn sm" data-sd="${s.id}">Drill 20</button></td></tr>`;
  };
  const table = list => `<table class="t"><thead><tr><th class="num">#</th><th>Sheet</th><th>Priority</th><th style="width:20%">Your accuracy</th><th></th></tr></thead><tbody>${list.map(row).join("")}</tbody></table>`;
  app.innerHTML = `<div class="row"><h1 style="margin:0">Cheat sheets</h1><span class="spacer"></span><a class="btn sm" href="#/sheet/must">Print must-do sheets</a><a class="btn sm" href="#/sheet/all">Print all</a></div>
  <p class="muted">Section B sheets are ranked by how many questions each topic had per paper in the seven DoE papers of 2021–2025. Every sheet has three parts: <b>Must do</b>, <b>Most probable questions</b> and <b>If time permits</b>. A <span class="y">2025</span> tag means that fact was asked in that year's paper. Read a sheet, then drill its questions.</p>
  <div class="card"><h2>Section B: Computer Science + Teaching Methodology</h2><p class="muted small" style="margin-top:0">100 marks. You must score the qualifying percentage here, and ties are broken on Section B.</p>${table(SHEETS.filter(s => s.part === "B"))}</div>
  <div class="card" style="margin-top:16px"><h2>Section A: general sections</h2><p class="muted small" style="margin-top:0">100 marks, 20 per section, ranked by marks gained per hour of revision.</p>${table(SHEETS.filter(s => s.part === "A"))}</div>`;
  app.querySelectorAll("[data-sd]").forEach(b => b.onclick = () => sheetDrill(b.dataset.sd));
}
function sheetCard(s) {
  return `<article class="card sheet" id="sheet-${s.id}"><div class="row" style="gap:8px"><h1 style="margin:0">${esc(s.title)}</h1>${tierPill(s)}<span class="pill">${s.part === "B" ? "Section B" : "Section A"} · #${s.rank}</span></div>
    <p class="muted" style="margin:6px 0 0">${esc(s.freq)}</p>
    <section class="sblk must"><h2>Must do</h2>${s.must}</section>
    <section class="sblk prob"><h2>Most probable questions</h2>${s.probable}</section>
    <section class="sblk later"><h2>If time permits</h2>${s.later}</section></article>`;
}
function sheetView(id) {
  if (id === "must" || id === "all") {
    const list = SHEETS.filter(s => id === "all" || s.tier === "must");
    app.innerHTML = `<div class="row noprint" style="margin-bottom:12px"><a class="btn sm" href="#/sheets">← All sheets</a><span class="spacer"></span><span class="muted small">${list.length} sheets</span><button class="btn sm primary" id="sp">Print / save as PDF</button></div>${list.map(sheetCard).join("")}`;
    app.querySelector("#sp").onclick = () => window.print();
    return;
  }
  const i = SHEETS.findIndex(x => x.id === id);
  if (i < 0) { sheetsIndex(); return; }
  const s = SHEETS[i], prev = SHEETS[i - 1], next = SHEETS[i + 1];
  app.innerHTML = `<div class="row noprint" style="margin-bottom:12px"><a class="btn sm" href="#/sheets">← All sheets</a><span class="spacer"></span><button class="btn sm" id="sp">Print / save as PDF</button><button class="btn sm primary" id="sd">Drill 20 questions</button></div>
  ${sheetCard(s)}
  <div class="row noprint" style="margin-top:12px">${prev ? `<a class="btn" href="#/sheet/${prev.id}">← ${esc(prev.title)}</a>` : ""}<span class="spacer"></span>${next ? `<a class="btn" href="#/sheet/${next.id}">${esc(next.title)} →</a>` : ""}</div>`;
  app.querySelector("#sp").onclick = () => window.print();
  app.querySelector("#sd").onclick = () => sheetDrill(s.id);
}

/* Optional local add-on file (not part of the published site). Only looked for when the app
   is opened from disk, so the hosted site never requests a missing file. */
function mergeExtras() {
  const X = (window.DSSSB_EXTRAS && window.DSSSB_EXTRAS.explanations) || {};
  for (const pid in X) for (const n in X[pid]) { const q = Q[pid + "#" + n]; if (q) q.ex = X[pid][n]; }
}
if (location.protocol === "file:") {
  const s = document.createElement("script");
  s.src = "data/extras.js";
  s.onload = () => { mergeExtras(); route(); };
  s.onerror = () => route();
  document.head.appendChild(s);
} else route();
</script>
</body>
